name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: clippy-

      - name: Run clippy (lib)
        run: cargo clippy --lib --workspace -- -D warnings

      - name: Run clippy (tests)
        run: cargo clippy --tests --workspace -- -D warnings
        continue-on-error: true

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Run tests
        run: cargo test --workspace --verbose

  lean:
    name: Lean proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Install pinned Aeneas and Charon
        env:
          AENEAS_RELEASE: nightly-2026.11.21-2e3d448
          AENEAS_SHA256: 7bb314c2a58f64178a2849bfcd3339d5a4a34e9f47f2530ae064548c614c25e0
        run: |
          tool_dir="$RUNNER_TEMP/aeneas"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 \
            "https://github.com/AeneasVerif/aeneas/releases/download/$AENEAS_RELEASE/aeneas-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/aeneas.tar.gz"
          printf '%s  %s\n' "$AENEAS_SHA256" "$RUNNER_TEMP/aeneas.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/aeneas.tar.gz" -C "$tool_dir"
          echo "AENEAS_HOME=$tool_dir" >> "$GITHUB_ENV"
          rustup toolchain install nightly-2026-09-17 --profile minimal \
            --component rustc-dev,rust-src,llvm-tools-preview

      - name: Install pinned elan
        env:
          ELAN_SHA256: 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' "$ELAN_SHA256" "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean dependencies
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: formal/aeneas/.lake/packages
          key: lean-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('formal/aeneas/lean-toolchain', 'formal/aeneas/lake-manifest.json', 'formal/aeneas/lakefile.toml') }}

      - name: Fetch Mathlib cache using locked dependencies
        if: steps.lean-cache.outputs.cache-hit != 'true'
        working-directory: formal/aeneas
        run: lake exe cache get

      - name: Prove current Rust and reject six mutations
        run: bun formal/aeneas/check.ts --mutation-test

      - name: Check generated definition and dependency lock are current
        run: git diff --exit-code -- formal/aeneas/Nostos.lean formal/aeneas/lake-manifest.json

      - name: Upload mutation proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-mutation-logs
          path: formal/aeneas/.lake/mutation-*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
