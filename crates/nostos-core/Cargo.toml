[package]
name = "club-nostos"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Bracket / lifecycle / Outcome primitives for Rust. Climb the ladder of abstraction, then come back down with new eyes."
keywords = ["bracket", "lifecycle", "outcome", "adt", "graph"]
categories = ["rust-patterns", "data-structures"]
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"
rust-version.workspace = true

# crates.io publication name = `club-nostos` (chronista-club ecosystem convention)。
# Rust crate identifier (lib name) = `nostos` ── lib 名は bare name 方針 (2026-05-16)。
# `club-` prefix は crates.io 衝突回避のため package 名に付くが、 lib 名は code path に
# 属するため prefix なし。 詳細: chronista-club CONVENTIONS.md (https://github.com/chronista-club/.github)
[lib]
name = "nostos"
path = "src/lib.rs"

